version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: creo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - creo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creo-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/creo
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - creo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - creo-network

volumes:
  mongo-data:

networks:
  creo-network:
    driver: bridge
