<section id="dashboard-view" class="view-section active">
  <div class="accounts-layout">
    <div class="accounts-grid">
      
      <!-- Quick Actions Bar -->
      <div class="grid-full">
        <div class="flex flex-wrap items-center gap-3 p-4 bg-white border border-gray-150 rounded-xl shadow-sm mb-1">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mr-2 flex items-center gap-1.5"><i class="fa-solid fa-bolt text-[11px] text-purple-500"></i> Quick Actions:</span>
          
          <button onclick="navigateToScriptStudio()" class="flex items-center gap-2 px-3.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-lg text-xs font-semibold transition-all duration-200 border border-purple-100/50 hover:scale-[1.02] cursor-pointer">
            <i class="fa-solid fa-signature"></i>
            <span>New Script</span>
          </button>
          
          <button onclick="navigateToChannelAnalysis()" class="flex items-center gap-2 px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold transition-all duration-200 border border-rose-100/50 hover:scale-[1.02] cursor-pointer">
            <i class="fa-brands fa-youtube"></i>
            <span>Analyze Channel</span>
          </button>
          
          <button onclick="navigateToHookStudio()" class="flex items-center gap-2 px-3.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-lg text-xs font-semibold transition-all duration-200 border border-amber-100/50 hover:scale-[1.02] cursor-pointer">
            <i class="fa-solid fa-magnet"></i>
            <span>Generate Hooks</span>
          </button>
        </div>
      </div>

      <!-- Metrics Row -->
      <div class="grid-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-2">
          
          <!-- Card 1: Plan Tier -->
          <div class="metric-card bg-gradient-to-br from-white to-purple-50/20 border border-gray-150 border-t-4 border-t-purple-500 rounded-xl p-5 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
            <div class="flex justify-between items-center mb-4 text-[10px] font-bold tracking-widest text-gray-400 uppercase">
              <span>Subscription Plan</span>
              <div class="relative w-8 h-8 rounded-lg bg-purple-50 flex items-center justify-center text-purple-600 shadow-sm shadow-purple-100">
                <div class="absolute inset-0 bg-purple-400 rounded-lg blur-sm opacity-25 scale-110"></div>
                <i class="fa-solid fa-crown relative z-10 text-xs"></i>
              </div>
            </div>
            <div class="text-3xl font-bold tracking-tight text-gray-900" id="dashPlanName">Trial</div>
            <div class="text-xs text-gray-500 mt-2" id="dashPlanSubtext">7-day free trial</div>
          </div>

          <!-- Card 2: Generations Usage -->
          <div class="metric-card bg-gradient-to-br from-white to-blue-50/20 border border-gray-150 border-t-4 border-t-blue-500 rounded-xl p-5 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
            <div class="flex justify-between items-center mb-4 text-[10px] font-bold tracking-widest text-gray-400 uppercase">
              <span>AI Generations</span>
              <div class="relative w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
              </div>
            </div>
            <div class="text-3xl font-bold tracking-tight text-gray-900">
              <span id="dashGenerationsUsed">0</span><span class="text-xl font-normal text-gray-400"> / </span><span id="dashGenerationsLimit">20</span>
            </div>
            <div class="h-2 w-full bg-gray-100 rounded-full mt-4 overflow-hidden border border-gray-50">
              <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full transition-all duration-500" id="dashGenerationsBar" style="width: 0%"></div>
            </div>
            <div class="text-xs text-gray-500 mt-2.5" id="dashGenerationsRemaining">20 remaining</div>
          </div>

          <!-- Card 3: Account Status -->
          <div class="metric-card bg-gradient-to-br from-white to-emerald-50/20 border border-gray-150 border-t-4 border-t-emerald-500 rounded-xl p-5 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-300">
            <div class="flex justify-between items-center mb-4 text-[10px] font-bold tracking-widest text-gray-400 uppercase">
              <span>Account Status</span>
              <div class="relative w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600">
                <i class="fa-solid fa-circle-check text-xs"></i>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-3xl font-bold tracking-tight text-emerald-600" id="dashAccountStatus">Active</div>
              <span class="relative flex h-2.5 w-2.5 mt-1">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
              </span>
            </div>
            <div class="text-xs text-gray-500 mt-2" id="dashRenewalText">Renews --</div>
          </div>

        </div>
      </div>

      <!-- Two Column Activity Area -->
      <!-- Left Column: Recent Scripts -->
      <div class="grid-left">
        <div class="bg-white border border-gray-150 rounded-xl p-6 shadow-sm min-h-[340px] flex flex-col">
          <div class="flex items-center gap-2 pl-3 border-l-4 border-l-purple-500 mb-5">
            <h3 class="text-xs font-bold text-gray-900 tracking-wider uppercase">Recent Scripts</h3>
          </div>
          <div id="dashRecentScripts" class="flex-1 flex flex-col justify-between">
            <!-- Dynamically populated or empty state -->
          </div>
        </div>
      </div>

      <!-- Right Column: Recent Audits -->
      <div class="grid-right">
        <div class="bg-white border border-gray-150 rounded-xl p-6 shadow-sm min-h-[340px] flex flex-col">
          <div class="flex items-center gap-2 pl-3 border-l-4 border-l-rose-500 mb-5">
            <h3 class="text-xs font-bold text-gray-900 tracking-wider uppercase">Recent Competitor Audits</h3>
          </div>
          <div id="dashRecentAudits" class="flex-1 flex flex-col justify-between">
            <!-- Dynamically populated or empty state -->
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
