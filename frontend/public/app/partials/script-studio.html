<section id="script-view" class="view-section">

  <!-- Canvas split: script canvas | script tester -->
  <div class="canvas-area">

    <!-- LEFT - Script Canvas -->
    <div class="script-canvas" id="scriptCanvas">

      <div class="canvas-topbar">
        <h2>Script Canvas</h2>
        <button class="copy-full-btn" id="copyFullBtn" onclick="copyFullScript()" style="display:none;">
          <i class="fa-regular fa-copy"></i> Copy Script
        </button>
      </div>

      <!-- Empty state -->
      <div class="canvas-empty w-full relative" id="canvasEmpty" style="height: auto; align-items: stretch; justify-content: flex-start; text-align: left; padding: 0;">
        <div id="scriptEmptyState" class="w-full relative transition-opacity duration-200" style="opacity: 0.55; pointer-events: none; max-width: 600px; margin: 24px auto 0;">
          <div class="section-card relative border border-slate-200 rounded-xl p-5 bg-white shadow-sm flex flex-col gap-3" style="min-height: 200px;">
            <span class="absolute top-4 right-4 bg-slate-100 text-slate-400 text-[10px] font-medium rounded-full px-2 py-0.5" style="font-family: var(--mono);">example</span>
            
            <div class="sec-label text-[11px] font-medium text-slate-400 uppercase tracking-wider" style="font-family: var(--mono); margin-bottom: 0;">Short Form</div>
            
            <div class="sec-content text-sm text-slate-600 font-normal leading-relaxed relative" style="max-height: 110px; overflow: hidden; margin-top: 4px;">
              <p class="mb-1">You've been using AI wrong this entire time.</p>
              <p class="mb-1">Everyone's asking it to write for them.</p>
              <p class="mb-1">The creators actually winning? They use it to think.</p>
              
              <!-- Gradient mask overlay to fade out the rest of the text -->
              <div class="absolute bottom-0 left-0 right-0 h-16" style="background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.95)); pointer-events: none;"></div>
            </div>
            
            <div class="mt-1 text-blue-500 font-medium text-xs">Generate yours →</div>
          </div>
        </div>
      </div>

      <!-- Generated sections -->
      <div class="sections-grid" id="sectionsGrid" style="display:none;"></div>

      <!-- Meta bar -->
      <div class="script-meta-bar" id="scriptMeta" style="display:none;">
        <div class="meta-item"><strong id="metaWords">-</strong> words</div>
        <div class="meta-item"><strong id="metaDuration">-</strong> duration</div>
        <div class="hashtags" id="metaHashtags"></div>
      </div>

    </div>

    <!-- RIGHT - Script Tester -->
    <aside class="analysis-panel script-tester-panel">
      <div class="analysis-panel-title">
        <span>Script Tester</span>
        <span class="analysis-pill" id="scriptTesterStatus">Idle</span>
      </div>

      <div class="script-tester">
        <textarea id="scriptTesterInput" rows="8" placeholder="Paste or generate a script..."></textarea>
        <button class="analysis-main-btn" id="scriptTesterBtn" onclick="testCurrentScript()">
          <i class="fa-solid fa-arrow-trend-up"></i>
          <span>Analyze Script</span>
        </button>
        <div id="scriptTesterResult">
          <div class="analysis-empty-state">
            <div class="analysis-mini-score">--</div>
            <span>No script selected</span>
          </div>
        </div>
      </div>
    </aside>

  </div><!-- /canvas-area -->

  <!-- FLOATING INPUT BAR -->
  <div class="input-bar-wrapper">
    <div id="scriptStateLine" class="text-center text-slate-400 text-xs mb-2 transition-opacity duration-150" style="display: none;"></div>
    <div class="input-shell">
      <!-- Mode selector pill toggle -->
      <div class="mode-selector-pill">
        <button type="button" id="modeBtnLong" class="mode-btn active" onclick="setStudioMode('long')">Long Form</button>
        <button type="button" id="modeBtnShort" class="mode-btn" onclick="setStudioMode('short')">Short Form</button>
        <button type="button" id="modeBtnStory" class="mode-btn" onclick="setStudioMode('storytelling')">✦ Story Mode</button>
      </div>

      <textarea id="mainInput" rows="1"
        placeholder="Describe your content topic... e.g. How I built an AI SaaS in 48 hours as a solo founder" maxlength="2000"
        oninput="autoResize(this)"></textarea>

      <!-- Advanced Options Drawer -->
      <div class="options-drawer" id="optionsDrawer">
        <!-- Injected dynamically in script-studio.js based on active mode -->
      </div>

      <div class="input-bottom-row">
        <button type="button" class="options-toggle-btn" id="optionsToggleBtn" onclick="toggleOptionsDrawer()" title="Advanced Options">
          <i class="fa-solid fa-gear" id="optionsToggleIcon"></i>
        </button>
        <div class="tone-strip" id="toneStrip"></div>
        <button class="generate-btn" id="generateBtn" onclick="triggerGenerate()">
          <span id="generateIcon"><i class="fa-solid fa-paper-plane"></i></span>
        </button>
      </div>
    </div>
  </div>

</section>
