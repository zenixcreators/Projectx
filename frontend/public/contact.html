<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Creo Creator Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .contact-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            margin-top: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fbfbfb;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #09090b;
            background: #ffffff;
            outline: none;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar" style="position: sticky; top: 0; background: rgba(252, 252, 253, 0.8); backdrop-filter: blur(10px); z-index: 100;">
        <div class="container nav-container">
            <a href="/" class="logo">
                <i class="fa-solid fa-cube logo-icon"></i>
                <span>Creo</span>
            </a>
            <ul class="nav-links">
                <li><a href="/#home">Home</a></li>
                <li><a href="/#features">Features</a></li>
                <li><a href="/#pricing">Pricing</a></li>
                <li><a href="/contact.html" class="active">Contact</a></li>
            </ul>
            <a href="/login.html" class="btn btn-primary nav-btn">Log in</a>
        </div>
    </nav>

    <!-- Content -->
    <section style="padding: 80px 0; min-height: 70vh;">
        <div class="container" style="max-width: 600px;">
            <div class="text-center" style="margin-bottom: 24px;">
                <h1 style="font-size: 38px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 8px;">Contact Support</h1>
                <p style="color: var(--text-muted); font-size: 15px;">Have questions, feature requests, or billing inquiries? Drop us a line below.</p>
            </div>

            <div class="contact-card">
                <form id="contactForm" onsubmit="submitContactForm(event)">
                    <div class="form-group">
                        <label for="contactName">Name</label>
                        <input type="text" id="contactName" class="form-input" required placeholder="e.g. Robin Hood">
                    </div>
                    <div class="form-group">
                        <label for="contactEmail">Email Address</label>
                        <input type="email" id="contactEmail" class="form-input" required placeholder="e.g. robin@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="contactMessage">Message</label>
                        <textarea id="contactMessage" class="form-input" rows="5" required placeholder="Describe your query in detail..."></textarea>
                    </div>
                    
                    <button type="submit" id="btnSubmitContact" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-size: 14.5px;">Send Message</button>
                    
                    <div id="contactStatusMsg" style="margin-top: 16px; font-size: 13.5px; text-align: center; font-weight: 550;"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="margin-top: 0; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
                <p>&copy; 2026 Creo Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        async function submitContactForm(e) {
            e.preventDefault();
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const message = document.getElementById('contactMessage').value.trim();
            
            const btn = document.getElementById('btnSubmitContact');
            const statusMsg = document.getElementById('contactStatusMsg');
            
            if (!name || !email || !message) return;
            
            btn.disabled = true;
            statusMsg.textContent = 'Sending message...';
            statusMsg.style.color = 'var(--text-muted)';
            
            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });
                
                if (res.ok) {
                    statusMsg.textContent = 'Thank you! Your message has been received. We will get back to you shortly.';
                    statusMsg.style.color = '#16a344'; // Green
                    document.getElementById('contactForm').reset();
                } else {
                    const data = await res.json().catch(() => ({}));
                    statusMsg.textContent = data.error || 'Failed to submit form. Please try again.';
                    statusMsg.style.color = '#ef4444'; // Red
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Connection error. Please verify network status.';
                statusMsg.style.color = '#ef4444'; // Red
            } finally {
                btn.disabled = false;
            }
        }
    </script>

    <script src="feedback.js" defer></script>
</body>

</html>
