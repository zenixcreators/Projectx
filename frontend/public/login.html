<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Creo</title>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="auth-shell">
    <section class="auth-art" id="artPanel">
      <video autoplay loop muted playsinline class="pinterest-video">
        <source src="login_signup.mp4" type="video/mp4">
      </video>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="panel-logo">*</div>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Access your studio anytime, anywhere - and keep everything flowing in one place.</p>

        <form class="auth-form" id="authForm" data-mode="login">
          <label>
            Your email
            <input type="email" name="email" placeholder="name@gmail.com" autocomplete="email" required>
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          </label>
          <div class="form-link-row">
            <button class="inline-link" id="forgotPasswordBtn" type="button">Forgot password?</button>
          </div>
          <button class="auth-btn primary" type="submit">Log in</button>
        </form>

        <form class="auth-form reset-form" id="forgotPasswordForm" hidden>
          <div class="otp-heading">
            <span class="otp-icon"><i class="fa-solid fa-key"></i></span>
            <div>
              <h3>Reset your password</h3>
              <p>Enter your account email and we'll send a reset code.</p>
            </div>
          </div>
          <label>
            Your email
            <input type="email" name="email" placeholder="name@gmail.com" autocomplete="email" required>
          </label>
          <button class="auth-btn primary" type="submit">Send Reset Code</button>
          <button class="auth-btn ghost" id="backToLoginBtn" type="button">Back to login</button>
        </form>

        <form class="auth-form reset-form" id="resetPasswordForm" hidden>
          <div class="otp-heading">
            <span class="otp-icon"><i class="fa-solid fa-shield-halved"></i></span>
            <div>
              <h3>Enter reset code</h3>
              <p id="resetEmailText">Use the code sent to your email.</p>
            </div>
          </div>
          <label>
            Reset code
            <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
          </label>
          <label>
            New password
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          </label>
          <button class="auth-btn primary" type="submit">Reset Password</button>
          <button class="auth-btn ghost" id="requestAnotherResetBtn" type="button">Use another email</button>
        </form>

        <div class="social-divider">or continue with</div>

        <div class="social-group">
          <div id="googleButton" class="google-slot"></div>
        </div>

        <div class="auth-message" id="authMessage"></div>
        <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="feedback.js" defer></script>
</body>

</html>
