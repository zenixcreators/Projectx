<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Aurora</title>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="auth-shell">
    <section class="auth-art" id="artPanel">
      <video autoplay loop muted playsinline class="pinterest-video">
        <source src="login_signup.mp4" type="video/mp4">
      </video>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="panel-logo">*</div>
        <h2>Create an account</h2>
        <p class="auth-subtitle">Access your tasks, notes, and projects anytime, anywhere - and keep everything flowing
          in one place.</p>

        <form class="auth-form" id="authForm" data-mode="signup">
          <div class="form-grid">
            <label>
              First name
              <input type="text" name="firstName" placeholder="First Name" autocomplete="given-name" maxlength="60" required>
            </label>
            <label>
              Last name
              <input type="text" name="lastName" placeholder="Last Name" autocomplete="family-name" maxlength="60">
            </label>
          </div>
          <label>
            Your email
            <input type="email" name="email" placeholder="name@gmail.com" autocomplete="email" required>
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" minlength="10" required>
          </label>
          <button class="auth-btn primary" type="submit">Get Started</button>
        </form>

        <form class="auth-form otp-form" id="otpForm" hidden>
          <div class="otp-heading">
            <span class="otp-icon"><i class="fa-solid fa-shield-halved"></i></span>
            <div>
              <h3>Verify your email</h3>
              <p id="otpEmailText">Enter the code we sent to your inbox.</p>
            </div>
          </div>
          <label>
            Verification code
            <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
          </label>
          <button class="auth-btn primary" type="submit">Verify Email</button>
          <button class="auth-btn ghost" id="resendOtpBtn" type="button">Resend code</button>
        </form>

        <div class="social-divider">or continue with</div>

        <div class="social-group">
          <div id="googleButton" class="google-slot"></div>
        </div>


        <div class="auth-message" id="authMessage"></div>
        <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>

</html>
