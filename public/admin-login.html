<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Nexus Creator Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --border-glow: rgba(99, 102, 241, 0.2);
      --border-light: rgba(255, 255, 255, 0.5);
      --accent-indigo: #4f46e5;
      --accent-violet: #6366f1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --glass-blur: blur(16px);
      --shadow-premium: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow lights in background */
    .glow-sphere {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
      z-index: 1;
    }

    .glow-1 { top: -100px; right: -100px; }
    .glow-2 { bottom: -100px; left: -100px; }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-premium);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 28px;
      transition: transform 0.3s ease;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .brand-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 8px;
      padding: 12px 14px 12px 40px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      background: #fff;
      border-color: var(--accent-indigo);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
      border: none;
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .message-el {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
    }

    .footer-link {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--accent-indigo);
    }
  </style>
</head>
<body>

  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-cube"></i>
      </div>
      <h1 class="brand-title">Nexus Admin</h1>
      <p class="brand-subtitle">Enter credentials to access the administrative control center.</p>
    </div>

    <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" class="form-input" id="adminEmail" required placeholder="admin@nexus.studio">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-input" id="adminPassword" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <span>Authenticate Portal</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="message-el" id="loginMessage"></div>

    <a href="/login.html" class="footer-link">
      <i class="fa-solid fa-arrow-left" style="font-size: 10px; margin-right: 4px;"></i>
      Return to Creator Login
    </a>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const messageEl = document.getElementById('loginMessage');
      
      messageEl.textContent = 'Verifying credentials...';
      messageEl.style.color = 'var(--text-secondary)';

      try {
        const response = await fetch('/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.textContent = 'Authentication successful! Redirecting...';
          messageEl.style.color = '#10b981';
          setTimeout(() => {
            window.location.href = '/app/admin.html';
          }, 1000);
        } else {
          messageEl.textContent = data.error || 'Access denied';
          messageEl.style.color = '#ef4444';
        }
      } catch (err) {
        messageEl.textContent = 'Connection error. Please try again.';
        messageEl.style.color = '#ef4444';
      }
    });
  </script>
</body>
</html>
