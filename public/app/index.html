<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora — Nexus Creator Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../app/app.css">
</head>

<body>

  <div class="app-container">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <i class="fa-solid fa-cube" style="font-size:11px;color:#fff;"></i>
          </div>
          <span class="sidebar-brand-text"><a href="../index.html" style="text-decoration: none;">Aurora</a></span>
        </div>
      </div>

      <nav class="sidebar-nav">

        <div class="nav-section">Create</div>

        <button class="nav-item active" data-target="script-view" data-title="Script Studio" onclick="switchView(this)">
          <i class="fa-solid fa-pen-nib"></i>
          <span>Script Studio</span>
        </button>

        <button class="nav-item" data-target="caption-view" data-title="Caption Studio" onclick="switchView(this)">
          <i class="fa-solid fa-closed-captioning"></i>
          <span>Caption Studio</span>
        </button>

        <button class="nav-item" data-target="thumbnail-view" data-title="Thumbnail Studio" onclick="switchView(this)">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Thumbnail Studio</span>
        </button>

        <div class="nav-section">Workspace</div>

        <button class="nav-item" data-tooltip="Projects">
          <i class="fa-solid fa-folder-open"></i>
          <span>Projects</span>
        </button>

        <button class="nav-item" data-tooltip="Content Library">
          <i class="fa-solid fa-layer-group"></i>
          <span>Content Library</span>
        </button>

        <button class="nav-item" data-tooltip="Exports">
          <i class="fa-solid fa-arrow-down-to-bracket"></i>
          <span>Exports</span>
        </button>

        <div class="nav-section">Insights</div>

        <button class="nav-item" data-tooltip="Analytics">
          <i class="fa-solid fa-chart-line"></i>
          <span>Analytics</span>
        </button>

        <button class="nav-item" data-tooltip="Performance">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Performance</span>
        </button>

        <div class="nav-section">Account</div>

        <button class="nav-item" data-tooltip="Settings">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </button>

        <button class="nav-item" data-tooltip="Profile">
          <i class="fa-regular fa-circle-user"></i>
          <span>Profile</span>
        </button>

      </nav>

      <!-- Footer -->
      <div class="sidebar-footer">
        <div class="sidebar-upgrade">
          <div class="upgrade-label">You're on Free</div>
          <div class="upgrade-title">Unlock Pro features</div>
          <button class="upgrade-btn">Upgrade to Pro →</button>
        </div>
        <div class="user-row">
          <div class="user-avatar">NK</div>
          <div class="user-meta">
            <div class="user-name">Nilesh Kumar</div>
            <div class="user-plan">Free · 3 scripts left</div>
          </div>
        </div>
      </div>

    </aside>

    <!-- ═══ MAIN ═══ -->
    <div class="main-wrapper">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-title">
          <span id="current-view-title">Script Studio</span>
          <span class="topbar-badge">LIVE</span>
        </div>
        <div style="margin-left:auto;">
          <button class="btn-primary" onclick="document.querySelector('.upgrade-btn').click()">
            Upgrade Plan
          </button>
        </div>
      </header>

      <!-- WORKSPACE -->
      <main class="workspace">
        <div id="featurePartials">
          <div data-partial="partials/script-studio.html"></div>
          <div data-partial="partials/caption-studio.html"></div>
          <div data-partial="partials/thumbnail-studio.html"></div>
        </div>

    </main>
  </div>
  </div>

  <!-- Scripts -->
  <script src="js/partials.js"></script>
  <script src="app.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/script-studio.js"></script>
  <script src="js/caption-studio.js"></script>
  <script src="js/thumbnail-studio.js"></script>
</body>

</html>
