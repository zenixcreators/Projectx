<section id="script-view" class="view-section active">

          <!-- Canvas split: 70% left | 30% right -->
          <div class="canvas-area">

            <!-- LEFT — Script Canvas -->
            <div class="script-canvas" id="scriptCanvas">

              <div class="canvas-topbar">
                <h2>Script Canvas</h2>
                <button class="copy-full-btn" id="copyFullBtn" onclick="copyFullScript()" style="display:none;">
                  <i class="fa-regular fa-copy"></i> Copy Script
                </button>
              </div>

              <!-- Empty state -->
              <div class="canvas-empty" id="canvasEmpty">
                <div class="canvas-empty-icon">✍️</div>
                <h3>Start shaping your next viral narrative.</h3>
                <p>Your AI-generated story workspace begins here. Describe your vision below.</p>
              </div>

              <!-- Generated sections -->
              <div class="sections-grid" id="sectionsGrid" style="display:none;"></div>

              <!-- Meta bar -->
              <div class="script-meta-bar" id="scriptMeta" style="display:none;">
                <div class="meta-item"><strong id="metaWords">—</strong> words</div>
                <div class="meta-item"><strong id="metaDuration">—</strong> duration</div>
                <div class="hashtags" id="metaHashtags"></div>
              </div>

            </div>

            <!-- RIGHT — Hooks Panel -->
            <div class="hooks-panel">
              <div class="hooks-panel-title">
                Hooks
                <span id="hookCount" style="display:none;">0</span>
              </div>
              <div class="hook-tester">
                <textarea id="hookTesterInput" rows="3" placeholder="Paste a hook to test..."></textarea>
                <button class="hook-test-main-btn" id="hookTesterBtn" onclick="testManualHook()">
                  <i class="fa-solid fa-gauge-high"></i>
                  <span>Test Hook</span>
                </button>
                <div id="hookTesterResult"></div>
              </div>
              <div id="hooksContent">
                <div class="hooks-empty-state">
                  <div class="ei">🎣</div>
                  Hooks will appear after you generate a script
                </div>
              </div>
            </div>

          </div><!-- /canvas-area -->

          <!-- FLOATING INPUT BAR -->
          <div class="input-bar-wrapper">
            <div class="input-shell">
              <textarea id="mainInput" rows="1"
                placeholder="Describe your content topic… e.g. I lost 5kg in 30 days and want to share how"
                maxlength="2000" oninput="autoResize(this)"></textarea>
              <div class="input-bottom-row">
                <div class="tone-strip" id="toneStrip"></div>
                <button class="generate-btn" id="generateBtn" onclick="triggerGenerate()">
                  <span id="generateIcon">↑</span>
                </button>
              </div>
            </div>
          </div>

        </section>
