<section id="thumbnail-view" class="view-section">

  <div class="thumbnail-workspace">
    <div class="thumb-layout">

      <main class="thumb-main-area">

        <section class="thumb-preview-panel">
          <div class="thumb-preview-wrap">
            <div class="canvas-placeholder" id="thumbPlaceholder">
              <i class="fa-solid fa-image"></i>
              <span>Preview Canvas</span>
            </div>
            <img id="mainThumbnail" src="" alt="Generated thumbnail preview" style="display: none;">
          </div>
        </section>

        <div class="thumb-ai-dock">
          <div class="dock-top">
            <textarea id="thumbPrompt" rows="3"
              placeholder="Describe the thumbnail psychology, emotion, and visual style..."></textarea>
          </div>
          <div class="dock-bottom">
            <div class="dock-left">
              <div class="model-row">
                <select id="thumbModel" class="thumb-model-select" aria-label="Image generation model">
                  <option value="black-forest-labs/FLUX.1-dev" selected>HuggingFace FLUX.1-dev</option>
                </select>
                <select id="thumbAspectRatio" class="thumb-aspect-ratio-select" aria-label="Aspect ratio">
                  <option value="16:9" selected>16:9 (HD)</option>
                  <option value="9:16">9:16 (Shorts)</option>
                  <option value="1:1">1:1 (Square)</option>
                  <option value="4:3">4:3 (Standard)</option>
                  <option value="3:4">3:4 (Portrait)</option>
                </select>
              </div>
              <div class="psychology-chips">
                <button class="psy-chip active">Mystery</button>
                <button class="psy-chip">Survival</button>
                <button class="psy-chip">Authority</button>
                <button class="psy-chip">Educational</button>
                <button class="psy-chip">Fear</button>
                <button class="psy-chip">Luxury</button>
              </div>
            </div>
            <div class="dock-right">
              <div class="dock-tools">
                <button class="dock-tool-btn"><i class="fa-solid fa-image"></i></button>
                <button class="dock-tool-btn"><i class="fa-brands fa-youtube"></i></button>
                <button class="dock-tool-btn"><i class="fa-solid fa-link"></i></button>
              </div>
              <button class="generate-btnn">
                <span>Analyze & Generate</span>
                <i class="fa-solid fa-sparkles"></i>
              </button>
            </div>
          </div>
        </div>

      </main>

      <aside class="thumb-dna-panel">

        <div class="dna-header">
          <div class="dna-header-left">
            <h2>THUMBNAIL DNA</h2>
            <span class="status-dot"></span>
          </div>
        </div>

        <div class="dna-scroll">

          <div class="dna-card highlight-card">
            <span class="dna-label">ATTENTION SCORE</span>
            <div class="dna-score-wrap">
              <span class="dna-score">--/10</span>
              <span class="dna-score-status">Awaiting concept</span>
            </div>
            <div class="dna-bar">
              <div class="dna-bar-fill empty"></div>
            </div>
            <p class="dna-desc">Generate a thumbnail to calculate attention strength.</p>
          </div>

          <div class="dna-card">
            <span class="dna-label">EMOTIONAL TRIGGER</span>
            <h3 class="dna-title">--</h3>
            <p class="dna-desc">--</p>
          </div>

          <div class="dna-card">
            <span class="dna-label">THUMBNAIL ARCHETYPE</span>
            <div class="dna-archetype">--</div>
          </div>

          <div class="dna-card">
            <span class="dna-label">COLOR PSYCHOLOGY</span>
            <div class="dna-swatches">
              <div class="dna-swatch muted"></div>
              <div class="dna-swatch muted"></div>
              <div class="dna-swatch muted"></div>
              <div class="dna-swatch muted"></div>
            </div>
            <p class="dna-desc">--</p>
          </div>

          <div class="dna-card">
            <span class="dna-label">VIEWER INTENT</span>
            <h3 class="dna-title">--</h3>
            <p class="dna-desc">--</p>
          </div>

          <div class="dna-card">
            <span class="dna-label">EYE TRACKING FLOW</span>
            <div class="heatmap-box">
              <div class="heat-dot dot-1"></div>
              <div class="heat-dot dot-2"></div>
            </div>
            <p class="dna-desc">--</p>
          </div>

          <div class="dna-card">
            <span class="dna-label">MOBILE READABILITY</span>
            <div class="mobile-score">-- / 10</div>
            <p class="dna-desc">--</p>
          </div>

        </div>

      </aside>

    </div>

  </div>

</section>
