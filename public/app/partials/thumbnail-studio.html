<section id="thumbnail-view" class="view-section">

      <div class="thumbnail-workspace">


        <div class="thumbnail-layout">

          <!-- Main Creative Preview (Single Image) -->
          <div class="thumbnail-feed-container">
            <div class="single-preview-wrap" id="thumbnailGrid">
              <!-- Single Immersive Thumbnail -->
              <div class="thumbnail-card hero large-preview" style="animation-delay: 0.1s">
                <div class="thumb-img-wrap">
                  <img id="mainThumbImg" src="assets/thumbnails/hero.png" alt="Thumbnail Preview">
                  <div class="thumb-overlay">
                    <div class="thumb-actions">
                      <button class="action-pill"><i class="fa-solid fa-wand-sparkles"></i> Remix</button>
                      <button class="action-pill"><i class="fa-solid fa-pen"></i> Edit</button>
                      <button class="action-pill"><i class="fa-solid fa-arrow-up"></i> Upscale</button>
                      <button class="action-pill"><i class="fa-solid fa-download"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- AI Insights & Creative DNA Panel (Right) -->
          <aside class="insights-panel-alt creative-dna">
            <div class="insights-header">
              <h2 class="mono">CREATIVE DNA</h2>
              <span class="status-dot online"></span>
            </div>

            <div class="insights-list">
              <!-- Dynamic CTR Score -->
              <div class="insight-card highlight">
                <label class="mono">ATTENTION SCORE</label>
                <div class="insight-val-wrap">
                  <span class="insight-val" id="aiScore">9.8/10</span>
                  <span class="insight-trend up"><i class="fa-solid fa-arrow-up"></i> High Potential</span>
                </div>
                <div class="insight-bar">
                  <div class="bar-fill" id="aiScoreBar" style="width: 98%"></div>
                </div>
              </div>

              <!-- Feeling & Tone -->
              <div class="insight-card">
                <label class="mono">FEELING & TONE</label>
                <div class="insight-val-wrap">
                  <span class="insight-val-small" id="aiFeeling">Mysterious & Intense</span>
                </div>
                <div class="insight-chips" id="aiToneChips">
                  <span class="chip-sm">Cinematic</span>
                  <span class="chip-sm">Curiosity</span>
                  <span class="chip-sm">Solo Journey</span>
                </div>
              </div>

              <!-- Color Mood -->
              <div class="insight-card">
                <label class="mono">COLOR MOOD</label>
                <div class="color-mood-swatches" id="aiColorMood">
                  <div class="swatch" style="background: #0B0D17" title="Deep Midnight"></div>
                  <div class="swatch" style="background: #1A1C2C" title="Moody Blue"></div>
                  <div class="swatch" style="background: #7C5CFF" title="Accent Glow"></div>
                  <div class="swatch" style="background: #FFFFFF" title="High Contrast"></div>
                </div>
                <p class="insight-desc" id="aiColorDesc">Deep midnight tones paired with high-contrast highlights to
                  evoke a sense of isolation.</p>
              </div>

              <!-- Visual Style -->
              <div class="insight-card">
                <label class="mono">VISUAL STYLE</label>
                <div class="insight-val-wrap">
                  <span class="insight-val-small" id="aiStyle">Surreal Realism</span>
                </div>
                <p class="insight-desc" id="aiStyleDesc">Inspired by high-end concept art and editorial photography
                  styles.</p>
              </div>

              <!-- Heatmap / Attention -->
              <div class="insight-card">
                <label class="mono">EYE-TRACKING PREDICTION</label>
                <div class="heatmap-preview">
                  <div class="heat-point" style="top: 40%; left: 30%"></div>
                  <div class="heat-point" style="top: 50%; left: 70%"></div>
                </div>
              </div>
            </div>
          </aside>

        </div>

        <!-- Floating AI Composer -->
        <div class="thumbnail-composer-wrapper">
          <div class="composer-shell glass">
            <div class="composer-top">
              <textarea id="thumbPrompt" rows="1"
                placeholder="Generate a cinematic YouTube thumbnail about surviving alone for 30 days..."
                oninput="autoResize(this)"></textarea>
            </div>
            <div class="composer-bottom">
              <div class="composer-left">
                <div class="prompt-chips">
                  <button class="chip">🎯 Viral</button>
                  <button class="chip">🎬 Cinematic</button>
                  <button class="chip">⚡ MrBeast</button>
                  <button class="chip">🧠 Documentary</button>
                  <button class="chip">🔥 High CTR</button>
                </div>
              </div>
              <div class="composer-right">
                <div class="composer-tools">
                  <button class="tool-btn"><i class="fa-solid fa-image"></i></button>
                  <button class="tool-btn"><i class="fa-solid fa-display"></i></button>
                </div>
                <button class="gen-btn-alt" onclick="generateThumbnails()">
                  <span>Generate</span>
                  <i class="fa-solid fa-sparkles"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>
