<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Aurora</title>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="auth-shell">
    <section class="auth-art" id="artPanel">
      <video autoplay loop muted playsinline class="pinterest-video">
        <source src="login_signup.mp4" type="video/mp4">
      </video>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="panel-logo">*</div>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Access your studio anytime, anywhere - and keep everything flowing in one place.</p>

        <form class="auth-form" id="authForm" data-mode="login">
          <label>
            Your email
            <input type="email" name="email" placeholder="email@example.com" required>
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="••••••••" required>
          </label>
          <button class="auth-btn primary" type="submit">Log in</button>
        </form>

        <div class="social-divider">or continue with</div>

        <div class="social-group">
          <div id="googleButton" class="google-slot"></div>
        </div>


        <div class="auth-message" id="authMessage"></div>
        <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>

</html>
