<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Aurora</title>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="auth-shell">
    <section class="auth-art" id="artPanel">
      <div class="art-glow"></div>

      <!-- Creator Doodles -->
      <i class="fa-solid fa-camera doodle" style="top: 15%; left: 20%; animation-delay: 0s;"></i>
      <i class="fa-solid fa-microphone doodle" style="top: 25%; left: 80%; animation-delay: -2s;"></i>
      <i class="fa-solid fa-film doodle" style="top: 60%; left: 15%; animation-delay: -5s;"></i>
      <i class="fa-solid fa-palette doodle" style="top: 75%; left: 70%; animation-delay: -1s;"></i>
      <i class="fa-solid fa-play doodle" style="top: 40%; left: 50%; animation-delay: -3s;"></i>
      <i class="fa-solid fa-wand-magic-sparkles doodle" style="top: 10%; left: 60%; animation-delay: -4s;"></i>

      <div class="art-logo">*</div>
      <div class="art-content">
        <span>You can easily</span>
        <h1 id="tagline">An unfair advantage for creators</h1>
      </div>
    </section>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="panel-logo">*</div>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Access your studio anytime, anywhere - and keep everything flowing in one place.</p>

        <form class="auth-form" id="authForm" data-mode="login">
          <label>
            Your email
            <input type="email" name="email" placeholder="email@example.com" required>
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="••••••••" required>
          </label>
          <button class="auth-btn primary" type="submit">Log in</button>
        </form>

        <div class="social-divider">or continue with</div>

        <div class="social-group">
          <div id="googleButton" class="google-slot"></div>
        </div>


        <div class="auth-message" id="authMessage"></div>
        <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>

</html>
